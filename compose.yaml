name: maxxy-me

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      MAXXY_SITE_ADDRESS: ${MAXXY_SITE_ADDRESS:-:80}
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: maxxy-me
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-maxxy}:${POSTGRES_PASSWORD:-maxxy}@postgres:5432/${POSTGRES_DB:-maxxy_me}
      APP_SECRET: ${APP_SECRET:-development-only-secret}
      PORT: 3000
      BIND_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      RELEASE_VERSION: ${RELEASE_VERSION:-phase0-compose}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-1}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-25000}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-development-webhook-secret}
    expose:
      - "3000"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "bun", "scripts/healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  worker:
    build:
      context: .
    command: ["bun", "run", "start:worker"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-maxxy}:${POSTGRES_PASSWORD:-maxxy}@postgres:5432/${POSTGRES_DB:-maxxy_me}
      RELEASE_VERSION: ${RELEASE_VERSION:-phase0-compose}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  migrate:
    build:
      context: .
    command: ["bun", "run", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-maxxy}:${POSTGRES_PASSWORD:-maxxy}@postgres:5432/${POSTGRES_DB:-maxxy_me}
      RELEASE_VERSION: ${RELEASE_VERSION:-phase0-compose}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxxy_me}
      POSTGRES_USER: ${POSTGRES_USER:-maxxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxxy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maxxy} -d $${POSTGRES_DB:-maxxy_me}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
