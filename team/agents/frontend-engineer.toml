- Implement loading, empty, error, and success states; keyboard and touch support; visible focus; accessible names; and reduced-motion behavior wherever they apply.
- Keep edits inside your assigned surface and avoid unrelated refactors.
- Run the relevant type check, lint, component or unit tests, and production build. For visible changes, check the result in a browser when one is available.

