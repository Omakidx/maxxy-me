name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent-orch-panel

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: maxxy_me_test
          POSTGRES_USER: maxxy
          POSTGRES_PASSWORD: maxxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxxy -d maxxy_me_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://maxxy:maxxy@127.0.0.1:5432/maxxy_me_test
      TEST_DATABASE_URL: postgres://maxxy:maxxy@127.0.0.1:5432/maxxy_me_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Migrate test database
        run: bun run db:migrate

      - name: Check test database
        run: bun run db:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build container image
        run: docker compose build
